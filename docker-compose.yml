services:
  app:
    image: salondesk-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SalonDesk
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Local demo key only. Override this outside of Docker Compose.
      APP_KEY: "base64:AXi+IBFffA0Fn1oNU1TQHTkEA9B1Rag+sMjInD17x8I="
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: salondesk
      DB_USERNAME: salondesk
      DB_PASSWORD: secret
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: bookings@salondesk.test
      MAIL_FROM_NAME: SalonDesk
      TENANT_BASE_DOMAIN: salondesk.test
      BILLING_DRIVER: fake
      AI_BOOKING_DRIVER: fake
      CASHIER_CURRENCY: sgd
      STRIPE_KEY: ""
      STRIPE_SECRET: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_BASIC: price_fake_basic
      STRIPE_PRICE_PRO: price_fake_pro
      OPENAI_API_KEY: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  worker:
    image: salondesk-app
    entrypoint: ["php", "artisan", "queue:work", "redis", "--queue=notifications,default", "--sleep=1", "--tries=3", "--no-interaction"]
    environment:
      APP_NAME: SalonDesk
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: "base64:AXi+IBFffA0Fn1oNU1TQHTkEA9B1Rag+sMjInD17x8I="
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: salondesk
      DB_USERNAME: salondesk
      DB_PASSWORD: secret
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: bookings@salondesk.test
      MAIL_FROM_NAME: SalonDesk
      TENANT_BASE_DOMAIN: salondesk.test
      BILLING_DRIVER: fake
      AI_BOOKING_DRIVER: fake
      CASHIER_CURRENCY: sgd
      STRIPE_KEY: ""
      STRIPE_SECRET: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_BASIC: price_fake_basic
      STRIPE_PRICE_PRO: price_fake_pro
      OPENAI_API_KEY: ""
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: salondesk
      MYSQL_USER: salondesk
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-testing-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data:
